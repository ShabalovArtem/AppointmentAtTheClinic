# checks.yaml для теми C02 «Запис до клініки». Засіб перевірки читає його разом з openapi.yaml.
# Ядро перевіряється завжди; у items — лише виконані пункти поза ядром.

items:
  - О1.5   # час виконання й метрики
  - О2.2   # дослідження точності
  - Д2.2   # екстраполяція Річардсона
  - Д2.4   # послідовне, попарне й компенсоване сумування
  - Д2.5   # паралельна гістограма (histogram нижче)
  - Д2.6   # скасування розрахунку (compute.async_body нижче)

services:
  api: api
  spark-worker-1: spark-worker-1
  stream: stream
  coordinator-a: coordinator-a
  coordinator-b: coordinator-b

load_s: 10

# O1.4: стан ресурсу з полем інваріанта (dd-main є в демоданих, приклад normal подає саме туди)
resource:
  path: /v1/doctor-day/dd-main
  ok_field: invariant_ok

# O1.5: імена в /metrics
metrics:
  - queue_length
  - processing
  - rejected

# lab 2: допуск (відносний), n для прискорення, режими спільної суми, асинхронний розрахунок, гістограма
compute:
  tolerance: 1.0e-6
  bench_n: 20000000
  modes:
    param: mode
    values:
      - none
      - lock
      - local
  async_body:
    async: true
histogram:
  field: histogram

# Розділи ЛР3–ЛР6 заповнюються разом із відповідними роботами.
